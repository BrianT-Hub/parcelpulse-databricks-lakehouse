bundle:
  name: parcelpulse
  databricks_cli_version: ">= 1.10.0"

include:
  - resources/*.yml

sync:
  paths:
    - .
  include:
    - src/notebooks/*.py

variables:
  catalog_name:
    description: Unity Catalog catalog used by every task in the pipeline.

targets:
  dev:
    default: true
    mode: development
    variables:
      catalog_name: parcelpulse_dev
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

  test:
    mode: development
    variables:
      catalog_name: parcelpulse_test
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

  prod:
    mode: production
    variables:
      catalog_name: parcelpulse_prod
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
